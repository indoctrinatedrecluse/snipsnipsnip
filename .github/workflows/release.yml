name: Release

# Builds a Windows desktop release (setup installer .exe + standalone .exe + portable .zip)
# and publishes it to a GitHub Release whenever a version tag is pushed (e.g. `v1.0.0`).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Run frontend unit tests
        run: npm test

      - name: Build Tauri app & create GitHub Release
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SnippetVault ${{ github.ref_name }}"
          releaseBody: "SnippetVault ${{ github.ref_name }} release.\n\nSee CHANGELOG.md for detailed release notes. Download the NSIS installer or portable zip below."
          releaseDraft: false
          prerelease: false

      - name: Package Portable Zip
        shell: pwsh
        run: |
          $Tag = "${{ github.ref_name }}"
          $ExePath = if (Test-Path "src-tauri/target/release/SnippetVault.exe") {
            "src-tauri/target/release/SnippetVault.exe"
          } elseif (Test-Path "src-tauri/target/release/snippetvault.exe") {
            "src-tauri/target/release/snippetvault.exe"
          } else {
            throw "Could not find built SnippetVault executable in src-tauri/target/release/"
          }

          $PortableDir = "SnippetVault-portable"
          $ZipName = "SnippetVault-$Tag-windows-portable.zip"

          New-Item -ItemType Directory -Path $PortableDir -Force | Out-Null
          Copy-Item -Path $ExePath -Destination "$PortableDir/SnippetVault.exe" -Force
          Compress-Archive -Path "$PortableDir/*" -DestinationPath $ZipName -Force

          Write-Host "Created portable archive: $ZipName"

      - name: Upload Portable Zip to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Tag = "${{ github.ref_name }}"
          $ZipName = "SnippetVault-$Tag-windows-portable.zip"
          gh release upload $Tag $ZipName --clobber
