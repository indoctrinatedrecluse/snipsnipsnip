[package]
name = "snippetvault"
version = "0.1.0"
description = "SnippetVault — a modern, privacy-focused, cloud-synchronized code snippet manager."
authors = ["SnippetVault contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "snippetvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
